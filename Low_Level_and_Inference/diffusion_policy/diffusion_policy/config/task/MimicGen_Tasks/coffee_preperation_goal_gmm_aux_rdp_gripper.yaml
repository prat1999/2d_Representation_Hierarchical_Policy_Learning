# Approach 2 with RDP_GRIPPER goals. Identical to coffee_preperation_goal_gmm_aux.yaml
# except the auxiliary GMM target is the RDP_GRIPPER subgoal (obs/goal_gripper_pts_rdp_gripper)
# instead of the Bayesian one (obs/goal_gripper_pts). Both live in the SAME h5
# files with the same (T, 4, 3) shape, so nothing about staging changes.
#
# Why a separate task config instead of +task.dataset.goal_source=rdp_gripper (the
# convention the Approach 1 RDP scripts use):
#   goal_source remaps EVERY 'goal_gripper'-typed key to obs/<key>_rdp_gripper. The
#   Approach 1 configs type only goal_gripper_pts that way, so the blanket
#   remap is safe there. Approach 2 also types present_gripper_pts as
#   goal_gripper (it supplies the 4 gripper anchors), and there is no
#   obs/present_gripper_pts_rdp_gripper -- nor should there be, since the present
#   gripper pose does not depend on how goals are defined. So goal_source=rdp_gripper
#   would look for a key that deliberately does not exist.
#
# Pair this with policy.aux_goal_key=goal_gripper_pts_rdp_gripper; the policy reads
# shape_meta["obs"][aux_goal_key] for n_keypoints, so the name must match.
#
# Key types are chosen for how LazyArticuBotDataset routes them:
#   depth      -> process_depth (uint16 mm -> float metres), welford normalizer
#                 (the policy reads RAW depth from batch["obs"], not nobs)
#   intrinsic/extrinsic -> matrix_keys, identity normalizer
#   goal_gripper        -> loaded raw, identity normalizer
name: coffee_preperation_goal_gmm_aux_rdp_gripper

image_shape: &image_shape [3, 256, 256]
depth_shape: &depth_shape [1, 256, 256]
shape_meta: &shape_meta
  obs:
    cam0_image:
      shape: *image_shape
      type: rgb
    cam1_image:
      shape: *image_shape
      type: rgb
    cam0_depth:
      shape: *depth_shape
      type: depth
    cam1_depth:
      shape: *depth_shape
      type: depth
    cam0_intrinsic:
      shape: [3, 3]
      type: intrinsic
    cam1_intrinsic:
      shape: [3, 3]
      type: intrinsic
    cam0_extrinsic:
      shape: [4, 4]
      type: extrinsic
    cam1_extrinsic:
      shape: [4, 4]
      type: extrinsic
    state:
      shape: [10]
      type: low_dim
    # Auxiliary target only — never reaches the DiT. RDP_GRIPPER subgoal, not Bayesian.
    goal_gripper_pts_rdp_gripper:
      shape: [4, 3]
      type: goal_gripper
    # 4 gripper keypoints: extra grounded tokens + mixture anchors.
    # Unchanged — the present gripper pose is goal-definition agnostic.
    present_gripper_pts:
      shape: [4, 3]
      type: goal_gripper
  action:
    shape: [10]

env_runner:
  _target_: diffusion_policy.env_runner.articubot_image_runner.ArticubotImageRunner
  n_train: 6
  n_train_vis: 2
  train_start_seed: 0
  n_test: 50
  n_test_vis: 4
  legacy_test: True
  test_start_seed: 100000
  max_steps: 300
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  fps: 10
  past_action: ${past_action_visible}
  n_envs: null
  observation_mode: image

dataset:
  _target_: diffusion_policy.dataset.lazy_articubot_dataset.LazyArticuBotDataset
  shape_meta: *shape_meta
  data_dir: /ocean/projects/cis240052p/pbhowal/2d_Representation_Hierarchical_Policy_Learning/MimicGen_Uncertainty_Dataset/LOW_LEVEL_GROOT_TRAINING_DATASET/NO_GMM_DATASET/COFFEE_PREPERATION_D1
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  seed: 42
  val_ratio: 0.02
  max_train_episodes: null
  action_mode: ${action_mode}
