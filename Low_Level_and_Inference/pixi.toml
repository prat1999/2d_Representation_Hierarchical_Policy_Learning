[workspace]
authors = ["Mino Nakura <minorunakura@gmail.com>"]
channels = ["pytorch", "nvidia", "conda-forge"]
channel-priority = "disabled"
name = "ArticuBot"
platforms = ["linux-64"]
version = "0.1.0"

[system-requirements]
linux = "4.18.0"
libc = { family = "glibc", version = "2.28" }
cuda = "12.9"

[dependencies]
python = "3.10.*"
pip = "*"
setuptools = "*"
wheel = "*"
cmake = "*"
# Core Math/ML/Robotics - Pins Retained
numpy = "1.23.*"
pandas = "1.5.*"
scipy = ">=1.13.0"
sympy = "*"
# 2.7.0+ is the first stable build with sm_120 (Blackwell, e.g. grogu-4-23)
# kernels; these builds still ship sm_86 (A6000) kernels too, so one env
# now covers both node types. The `pytorch-cuda` metapackage (pytorch
# channel) tops out at cuda 12.4 and is unmaintained past pytorch 2.5 --
# conda-forge's pytorch builds key off `cuda-version` instead.
pytorch = { version = ">=2.7.0,<3", build = "cuda*" }
cuda-version = "12.9.*"
# Infrastructure - Relaxed
requests = "*"
pyyaml = "*"
packaging = "*"
networkx = "*"
omegaconf = "*"
viser = ">=0.2.23,<0.3"
torchvision = ">=0.22.0,<0.23"
