[activation]
env = { PYTHONPATH = ".:3d_diffusion_policy/3D-Diffusion-Policy/3D-Diffusion-Policy:external/mast3r:external/mast3r/dust3r:external/Isaac-GR00T", PROJECT_DIR= ".", NUMEXPR_MAX_THREADS = "90", HYDRA_FULL_ERROR = "1",  SETUPTOOLS_USE_DISTUTILS = "stdlib", PYTHONNOUSERSITE = "1" }

[tasks]
install-mino-utils = """
git submodule update --init external/mino_utils && \
cd external/mino_utils && \
pip install -e .
"""
install-mast3r = """
git submodule update --init --recursive external/mast3r
"""
install-gr00t = """
git submodule update --init --recursive external/Isaac-GR00T && \
cd external/Isaac-GR00T && \
git checkout n1-release
"""